name: Billing cron

# Dispara POST /billing/cron/reconcile-pending, que hace dos cosas: reconcilia
# las suscripciones que quedaron en `pending` (por si el webhook de MercadoPago
# nunca llegó) y manda los recordatorios de vencimiento. El endpoint no tiene
# authMiddleware a propósito — no lo llama un usuario logueado — y se protege
# con el secreto compartido `x-cron-secret`.

on:
  schedule:
    # 13:00 UTC = 10:00 ART. El endpoint manda mails de recordatorio de
    # vencimiento, así que conviene una hora en la que la gente los lea y no
    # la madrugada. GitHub puede atrasar los cron hasta ~30min en horas pico;
    # la tarea es idempotente, así que el atraso no importa.
    - cron: "7 13 * * *"
  # Para dispararlo a mano desde la pestaña Actions, sin esperar 24hs.
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      # Capturamos el código HTTP y el cuerpo en vez de usar `curl -f`: con -f
      # el job falla con un exit code genérico y el log no dice QUÉ pasó, que
      # es justo lo que hace falta cuando el secreto se desincroniza entre
      # GitHub y Fly (síntoma: 401). El `test` final igual pone el job en rojo
      # ante cualquier respuesta que no sea 200, para que la reconciliación no
      # deje de correr en silencio. `--max-time` acota el caso en que Fly
      # acepta la conexión pero no responde.
      #
      # El cuerpo se imprime sin riesgo: es el conteo de reconciliaciones
      # ({"checked":N,"users":[...]}), no contiene secretos. El secreto va en
      # un header y NO en la URL, porque las URLs de `run` quedan escritas en
      # los logs de Actions, visibles para cualquiera con acceso al repo.
      - name: Reconciliar suscripciones pendientes
        run: |
          CODE=$(curl -sS --max-time 120 -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://trickapp-api.fly.dev/billing/cron/reconcile-pending" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $CODE"
          cat /tmp/resp.json
          echo ""
          test "$CODE" = "200"
